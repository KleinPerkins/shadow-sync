name: Reviewer App credential readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-sync-app-credential-readiness
  cancel-in-progress: false
jobs:
  app-credential-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'KleinPerkins/shadow-sync' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            tests
      - name: Verify readiness checker with synthetic fixtures
        run: python3 -I -B -m unittest discover -s tests -p 'test_app_credential_readiness.py' -v
      # The requested permissions are those used by the approved reviewer App.
      # Qualification uses GET only; cleanup revokes its token. No PR mutations.
      - name: Mint repository-scoped reviewer App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: KleinPerkins
          repositories: shadow-sync
          permission-contents: write
          permission-pull-requests: write
          skip-token-revoke: false
      - name: Verify App identity and repository access without changing PRs
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 -I -B scripts/app-credential-readiness.py
      # The token action's post hook warns rather than fails on revoke errors.
      # Explicit cleanup must revoke and then observe authentication refusal.
      - name: Revoke token and verify it is unusable
        if: ${{ always() && steps.app.outputs.token != '' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 -I -B scripts/app-credential-readiness.py --revoke
      - name: Retain nonsecret readiness receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-app-readiness
          path: |
            outputs/reviewer-app-readiness.json
            outputs/reviewer-app-revocation.json
          if-no-files-found: error
          retention-days: 14
