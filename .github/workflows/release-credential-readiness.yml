name: Release credential readiness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-sync-release-credential-readiness
  cancel-in-progress: false
jobs:
  release-credential-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'KleinPerkins/shadow-sync' &&
      github.ref == 'refs/heads/main'
    environment: release
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts
            Tests/Tooling
      - name: Verify readiness logic with synthetic fixtures
        run: python3 -I -B -m unittest discover -s Tests/Tooling -p 'test_release_credential_readiness.py' -v
      - name: Prepare pinned tools without signing credentials
        id: prepare
        run: python3 -I -B scripts/release-credential-readiness.py prepare
      - name: Qualify disposable signatures and Apple authentication
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: python3 -I -B scripts/release-credential-readiness.py qualify
      - name: Confirm temporary credentials are removed
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: python3 -I -B scripts/release-credential-readiness.py cleanup
      - name: Retain nonsecret qualification receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-credential-readiness
          path: outputs/release-credential-readiness.json
          if-no-files-found: error
          retention-days: 14
