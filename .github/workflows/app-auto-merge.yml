name: App auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: shadow-sync-app-maintenance
  cancel-in-progress: false
jobs:
  approve-and-arm:
    # Disabled unless the owner enables it after protected bootstrap, server
    # controls/no-App-bypass readback and trusted-main readiness. Ordinary delivery
    # is qualified separately by the next legitimate eligible PR, never a probe.
    if: >-
      vars.REVIEWER_APP_ENABLED == 'true' &&
      github.repository == 'KleinPerkins/shadow-sync' &&
      github.repository_id == '1442961455' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Execute only the trusted default-branch workflow revision. Never fetch
      # PR source or artifacts into this credential-bearing job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Mint the named repository-scoped reviewer token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Public immutable App identity; a differently named secret cannot
          # select another App. GitHub verifies this ID against the signing key.
          app-id: '4217367'
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: KleinPerkins
          repositories: shadow-sync
          permission-contents: write
          permission-pull-requests: write
      - name: Approve verified ordinary head and request native squash auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CI_READ_TOKEN: ${{ github.token }}
          REVIEWER_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          REVIEWER_INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REVIEWER_APP_ENABLED: ${{ vars.REVIEWER_APP_ENABLED }}
        run: python3 scripts/auto-merge.py
  qualify:
    # Read-only and disabled by default; never approves or arms a PR.
    if: >-
      vars.REVIEWER_APP_QUALIFY == 'true' &&
      github.repository == 'KleinPerkins/shadow-sync' &&
      github.repository_id == '1442961455' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Mint the named repository-scoped qualification token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '4217367'
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: KleinPerkins
          repositories: shadow-sync
          permission-contents: write
          permission-pull-requests: write
      - name: Verify current-main CI, effective controls and App identity/scope
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CI_READ_TOKEN: ${{ github.token }}
          REVIEWER_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          REVIEWER_INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          REVIEWER_APP_QUALIFY: ${{ vars.REVIEWER_APP_QUALIFY }}
        run: python3 scripts/qualify_reviewer.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-controls-readiness
          path: outputs/reviewer-controls-readiness.json
          if-no-files-found: error
          retention-days: 14
